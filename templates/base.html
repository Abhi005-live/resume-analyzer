<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a; color: white;
      cursor: none;
      overflow-x: hidden;
    }
    #bg-video {
      position: fixed; right: 0; bottom: 0;
      min-width: 100%; min-height: 100%;
      z-index: -2; object-fit: cover;
      filter: brightness(0.35) saturate(1.2);
    }
    .overlay {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(10,10,26,0.75) 0%, rgba(0,20,40,0.65) 100%);
      z-index: -1;
    }
    .content {
      position: relative; z-index: 1;
      color: white; padding: 40px;
      max-width: 460px; margin: auto;
      margin-top: 8%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,245,255,0.05);
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px;
      margin: 8px 0 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: white;
      font-size: 14px; outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      cursor: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #00f5ff;
      box-shadow: 0 0 0 3px rgba(0,245,255,0.15);
    }
    button[type="submit"], .content button {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #00f5ff22, #00ff8822);
      border: 1px solid #00f5ff55;
      color: #00f5ff; font-weight: 700;
      font-size: 15px; border-radius: 10px;
      cursor: none; margin-top: 4px;
      transition: all 0.3s ease;
      position: relative; overflow: hidden;
    }
    button[type="submit"]:hover, .content button:hover {
      background: linear-gradient(135deg, #00f5ff44, #00ff8844);
      box-shadow: 0 0 25px rgba(0,245,255,0.3);
      transform: translateY(-2px);
    }
    a { color: #00f5ff; text-decoration: none; transition: opacity 0.2s; }
    a:hover { opacity: 0.75; }
    h2 { color: #00f5ff; margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-text">ANALYZING</div>
  </div>

  <!-- Custom Cursor -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Background -->
  <video autoplay muted loop id="bg-video" playsinline>
    <source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- Floating Particles -->
  <div id="particles-container"></div>

  <!-- Page Content -->
  <div class="content reveal" id="main-content">
    {% block content %}{% endblock %}
  </div>

  <script>
    // ===== LOADER =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('page-loader').classList.add('hidden');
        triggerReveal();
      }, 800);
    });

    // ===== CUSTOM CURSOR =====
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';
    });

    (function animateRing() {
      rx += (mx - rx) * 0.12;
      ry += (my - ry) * 0.12;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(animateRing);
    })();

    document.querySelectorAll('a, button, input[type="submit"], [data-hover]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width = '52px'; ring.style.height = '52px';
        ring.style.borderColor = 'rgba(0,245,255,0.9)';
        dot.style.transform = 'translate(-50%,-50%) scale(1.8)';
      });
      el.addEventListener('mouseleave', () => {
        ring.style.width = '36px'; ring.style.height = '36px';
        ring.style.borderColor = 'rgba(0,245,255,0.5)';
        dot.style.transform = 'translate(-50%,-50%) scale(1)';
      });
    });

    // ===== ENTRANCE REVEAL =====
    function triggerReveal() {
      const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e, i) => {
          if (e.isIntersecting) {
            setTimeout(() => e.target.classList.add('visible'), i * 100);
          }
        });
      }, { threshold: 0.1 });
      els.forEach(el => io.observe(el));
    }

    // ===== 3D CARD TILT =====
    document.querySelectorAll('.card-3d').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width  - 0.5;
        const y = (e.clientY - r.top)  / r.height - 0.5;
        card.style.transform = `perspective(800px) rotateY(${x*12}deg) rotateX(${-y*12}deg) scale(1.02)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(800px) rotateY(0) rotateX(0) scale(1)';
      });
    });

    // ===== PARALLAX ON MOUSE MOVE =====
    document.addEventListener('mousemove', e => {
      const px = (e.clientX / window.innerWidth  - 0.5) * 20;
      const py = (e.clientY / window.innerHeight - 0.5) * 20;
      const vid = document.getElementById('bg-video');
      if (vid) vid.style.transform = `translate(${px * 0.4}px, ${py * 0.4}px) scale(1.05)`;
    });

    // ===== FLOATING PARTICLES =====
    const pc = document.getElementById('particles-container');
    const colors = ['#00f5ff', '#00ff88', '#7b61ff', '#ff6b6b'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 5 + 2;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${Math.random()*12+8}s;
        animation-delay:${Math.random()*8}s;
      `;
      pc.appendChild(p);
    }

    // ===== MICRO INTERACTION: Button ripple =====
    document.addEventListener('click', e => {
      const btn = e.target.closest('button, input[type="submit"]');
      if (!btn) return;
      const ripple = document.createElement('span');
      const r = btn.getBoundingClientRect();
      ripple.style.cssText = `
        position:absolute; border-radius:50%;
        width:10px; height:10px;
        background:rgba(255,255,255,0.4);
        left:${e.clientX - r.left - 5}px;
        top:${e.clientY - r.top - 5}px;
        transform:scale(0); pointer-events:none;
        animation: rippleAnim 0.5s ease forwards;
      `;
      btn.style.position = 'relative'; btn.style.overflow = 'hidden';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);
    });

    const style = document.createElement('style');
    style.textContent = `@keyframes rippleAnim { to { transform:scale(30); opacity:0; } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
